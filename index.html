<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .profile-title {
            font-size: 22px;
            font-weight: 700;
            color: #333333;
            margin-bottom: 8px;
        }
        .bio {
            font-size: 14px;
            color: #666666;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #444444;
            margin: 20px 0 10px;
            text-align: left;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tag {
            background: #f7f7f7;
            color: #555555;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid #eeeeee;
        }
        .link-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #222222;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .link-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="profile-title">내 이름 / 닉네임</h1>
        <p class="bio">안녕하세요! 간단한 한 줄 소개글을 작성하는 공간입니다.</p>
        
        <div class="section-title">LIKE / DISLIKE</div>
        <div class="tags">
            <span class="tag">⭕ 독서</span>
            <span class="tag">⭕ 음악</span>
            <span class="tag">❌ 소음</span>
        </div>

        <div class="section-title">LINKS</div>
        <a href="https://twitter.com" class="link-btn" target="_blank">X (Twitter)</a>
        <a href="https://tistory.com" class="link-btn" target="_blank">Blog</a>
    </div>
</body>
</html>
